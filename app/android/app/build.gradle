apply plugin: 'com.android.application'

android {
    namespace = "com.qinghaipao.autorun"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.qinghaipao.autorun"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// No third-party dependencies on purpose: HttpURLConnection for the upstream
// client, org.json for JSON, a hand-rolled ServerSocket for the local API, and
// plain android.app.Activity for the shell. Every library left out is dex
// bytes and a startup cost this app does not need.
